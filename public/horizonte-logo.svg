<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" fill="none">
  <!-- Horizonte Logística Vector Logo -->
  <g id="isotype">
    <!-- Left slanted stem (Steel Blue) -->
    <path d="M125 20 L146 20 L126 100 L105 100 Z" fill="#4A82C5" />
    
    <!-- Right slanted stem (Deep Royal Navy) -->
    <path d="M165 20 L186 20 L166 100 L145 100 Z" fill="#26378A" />

    <!-- Top Speed Arc (Solar Amber / Warm Orange) -->
    <path d="M45 74 Q 140 38 275 88" stroke="#F39818" stroke-width="9" stroke-linecap="round" fill="none" />
    
    <!-- Middle Speed Arc (Cerulean Blue) -->
    <path d="M40 92 Q 135 58 270 108" stroke="#4A82C5" stroke-width="7" stroke-linecap="round" fill="none" />
    
    <!-- Bottom Speed Arc (Deep Royal Navy) -->
    <path d="M42 108 Q 135 74 265 124" stroke="#1E2D72" stroke-width="7" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography Lockup -->
  <text x="160" y="148" text-anchor="middle" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="4" fill="#1C2969">HORIZONTE</text>
  <text x="160" y="172" text-anchor="middle" font-family="'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" letter-spacing="1" fill="#F29419">Logística</text>
</svg>
